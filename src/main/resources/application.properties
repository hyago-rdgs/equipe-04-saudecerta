spring.application.name=saudecerta
server.port=8080

# --- Persistencia: H2 em memoria (zero configuracao). Os dados somem ao reiniciar. ---
spring.datasource.url=jdbc:h2:mem:saudecerta;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# --- SaudeCerta ---
# Carrega pacientes, profissionais, agenda de hoje e usuarios de demonstracao.
saudecerta.dados-demo=true
# Raio-X: registra por quais camadas cada requisicao passou (ver docs/raio-x.md).
saudecerta.raio-x.ativo=true
# Token de acesso (JWT). Sem segredo configurado, uma chave aleatoria e gerada a cada inicializacao.
saudecerta.jwt.expiracao-minutos=480
saudecerta.jwt.segredo=

# --- Documentacao da API ---
springdoc.swagger-ui.path=/swagger-ui.html
